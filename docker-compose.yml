services:
  mswazi-web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mswazi1-web
    ports:
      - "8080:80"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:-https://YOUR-PROJECT-REF.supabase.co}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-YOUR-PUBLIC-ANON-KEY}
      DEMO_MODE: ${DEMO_MODE:-true}
    restart: unless-stopped