<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vendor Stall Storefront — MSWAZI</title>
  <link rel="icon" type="image/png" href="../assets/mswazi-mark.png" />
  <link rel="apple-touch-icon" href="../assets/mswazi-mark.png" />
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/components.css" />
  <link rel="stylesheet" href="../css/vendor.css" />
  <style>
    .nav { background: var(--navy-950); color: #fff; border-bottom: 3px solid var(--amber-500); padding: 0.8rem 0; position: sticky; top: 0; z-index: 30; }
    .nav-inner { max-width: 1040px; margin: 0 auto; padding: 0 1rem; display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; flex-wrap: wrap; }
    .nav-links { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; }
    .nav-links a { color: #e2e8f0; text-decoration: none; font-size: 0.84rem; font-weight: 600; padding: 0.35rem 0.65rem; border-radius: 999px; }
    .nav-links a.active { background: var(--amber-500); color: #fff; }
    .prod-desc { font-size: 0.82rem; color: var(--muted); }

    /* Stall Hero Cover Media */
    .stall-hero-media {
      margin-top: 1rem;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: #0f172a;
      max-height: 290px;
    }
    .stall-hero-media img,
    .stall-hero-media video {
      width: 100%;
      max-height: 290px;
      object-fit: contain;
      display: block;
    }

    /* Product Media Stage & Thumbnails */
    .prod-media-stage {
      position: relative;
      width: 100%;
      height: 185px;
      border-radius: 10px;
      overflow: hidden;
      background: #0f172a;
      border: 1px solid #e2e8f0;
      margin-bottom: 0.55rem;
    }
    .prod-media-stage img,
    .prod-media-stage video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .prod-thumbs {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      margin-bottom: 0.5rem;
    }
    .prod-thumb-btn {
      width: 44px;
      height: 44px;
      padding: 0;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid transparent;
      background: #0f172a;
      cursor: pointer;
      position: relative;
    }
    .prod-thumb-btn.active {
      border-color: var(--amber-500);
    }
    .prod-thumb-btn img,
    .prod-thumb-btn video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .prod-thumb-play {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.45);
      color: #fff;
      font-size: 0.68rem;
      font-weight: 800;
    }
  </style>
</head>
<body>
  <header class="nav">
    <div class="nav-inner">
      <a href="./stalls.html" class="brand-mark">
        <img src="../assets/mswazi-mark.png" alt="MSWAZI" />
        <span>MSWAZI <span style="color:var(--amber-500);">SHOP</span></span>
      </a>
      <div class="nav-links">
        <a href="./stalls.html">Stalls</a>
        <a href="./cart.html">Cart</a>
        <a href="./orders.html">Orders</a>
        <a href="./customer-profile.html">Account</a>
        <span id="currencyMount"></span>
      </div>
    </div>
  </header>

  <section class="vendor-hero">
    <div class="container">
      <a href="./stalls.html" style="color:#ffd384; text-decoration:none; font-size:0.82rem; font-weight:700;">← Back to Stalls</a>
      <div style="display:flex; justify-content:space-between; align-items:flex-end; gap:0.75rem; flex-wrap:wrap; margin-top:0.35rem;">
        <div>
          <span class="badge badge-active" id="stallCategoryBadge">Stall</span>
          <h1 class="vendor-hero-title" id="stallName">Loading Stall...</h1>
          <p class="vendor-hero-desc" id="stallDesc"></p>
          <div style="font-size:0.78rem; color:#cbd5e1; margin-top:0.35rem;" id="stallMeta"></div>
        </div>
        <a href="./cart.html" class="btn btn-amber">View Cart →</a>
      </div>
      <div id="stallHeroMediaMount"></div>
    </div>
  </section>

  <main class="container section">
    <div class="product-grid" id="productsContainer"></div>
  </main>

  <script type="module">
    import { formatKES, showToast, buildCurrencySelectorHtml, setSelectedCurrencyCode } from "../js/app.js";
    import { fetchVendorByIdOrSlug } from "../js/vendors.js";
    import { fetchProductsByVendor, addProductToCart } from "../js/products.js";

    document.getElementById("currencyMount").innerHTML = buildCurrencySelectorHtml("storeCurrencySelect");
    document.getElementById("storeCurrencySelect").addEventListener("change", (e) => {
      setSelectedCurrencyCode(e.target.value);
      renderProducts();
    });

    const params = new URLSearchParams(window.location.search);
    const identifier = params.get("vendor");
    const vendor = await fetchVendorByIdOrSlug(identifier);

    let products = [];

    function sortProductsByVendorArrangement(list) {
      return [...list].sort((a, b) => {
        const aOrder = Number.isFinite(Number(a.sort_order)) ? Number(a.sort_order) : 9999;
        const bOrder = Number.isFinite(Number(b.sort_order)) ? Number(b.sort_order) : 9999;
        if (aOrder !== bOrder) return aOrder - bOrder;
        return new Date(b.created_at || 0) - new Date(a.created_at || 0);
      });
    }

    function renderStallHeroMedia(v) {
      const mount = document.getElementById("stallHeroMediaMount");
      if (!v?.stall_media_url) {
        mount.innerHTML = "";
        return;
      }

      if (v.stall_media_type === "video") {
        mount.innerHTML = `
          <div class="stall-hero-media">
            <video src="${v.stall_media_url}" controls playsinline preload="metadata"></video>
          </div>
        `;
      } else {
        mount.innerHTML = `
          <div class="stall-hero-media">
            <img src="${v.stall_media_url}" alt="${v.business_name}" />
          </div>
        `;
      }
    }

    if (!vendor) {
      document.getElementById("stallName").textContent = "Stall Not Found";
      document.getElementById("productsContainer").innerHTML = `<div class="card product-card" style="grid-column:1/-1;"><strong>Stall unavailable</strong><span class="prod-desc">Return to <a href="./stalls.html" style="color:var(--amber-600); font-weight:700;">Stalls</a> to browse approved shops.</span></div>`;
    } else {
      document.title = `${vendor.business_name} — MSWAZI`;
      document.getElementById("stallCategoryBadge").textContent = vendor.category || "Stall";
      document.getElementById("stallName").textContent = vendor.business_name;
      document.getElementById("stallDesc").textContent = vendor.description || "Independent neighbourhood stall.";
      document.getElementById("stallMeta").textContent = `Area: ${vendor.area_slug} · Hours: ${vendor.opening_hours || "Daily"} · ${vendor.is_open === false ? "Currently Closed" : "Open"}`;

      renderStallHeroMedia(vendor);
      const rawProducts = await fetchProductsByVendor(vendor.id);
      products = sortProductsByVendorArrangement(rawProducts);
      renderProducts();
    }

    window.addItem = async (productId) => {
      const prod = products.find((p) => String(p.id) === String(productId));
      if (!prod || !vendor) return;
      await addProductToCart({ product: prod, vendor, quantity: 1 });
      showToast(`Added ${prod.name} to cart`);
    };

    window.selectProductMedia = (productId, mediaIndex) => {
      const prod = products.find((p) => String(p.id) === String(productId));
      const mediaList = Array.isArray(prod?.media) ? prod.media : [];
      const chosen = mediaList[mediaIndex];
      const stage = document.getElementById(`media-stage-${productId}`);
      if (!chosen || !stage) return;

      stage.innerHTML =
        chosen.type === "video"
          ? `<video src="${chosen.url}" controls playsinline preload="metadata"></video>`
          : `<img src="${chosen.url}" alt="${prod.name}" />`;

      document.querySelectorAll(`[data-prod-thumb="${productId}"]`).forEach((btn, idx) => {
        btn.classList.toggle("active", idx === mediaIndex);
      });
    };

    function buildProductMediaHtml(p) {
      const mediaList = Array.isArray(p.media) ? p.media : [];
      if (!mediaList.length) return "";

      const first = mediaList[0];
      const stageHtml =
        first.type === "video"
          ? `<video src="${first.url}" controls playsinline preload="metadata"></video>`
          : `<img src="${first.url}" alt="${p.name}" loading="lazy" />`;

      const thumbsHtml =
        mediaList.length > 1
          ? `<div class="prod-thumbs">
              ${mediaList
                .map(
                  (m, idx) => `
                  <button
                    type="button"
                    class="prod-thumb-btn ${idx === 0 ? "active" : ""}"
                    data-prod-thumb="${p.id}"
                    onclick="selectProductMedia('${p.id}', ${idx})"
                    title="${m.type === "video" ? "Play video" : "View photo"}"
                  >
                    ${
                      m.type === "video"
                        ? `<video src="${m.url}" muted playsinline></video><span class="prod-thumb-play">▶</span>`
                        : `<img src="${m.url}" alt="" />`
                    }
                  </button>
                `
                )
                .join("")}
            </div>`
          : "";

      return `
        <div class="prod-media-stage" id="media-stage-${p.id}">${stageHtml}</div>
        ${thumbsHtml}
      `;
    }

    function renderProducts() {
      const container = document.getElementById("productsContainer");
      if (!vendor) return;

      const available = products.filter((p) => p.is_available !== false);
      if (!available.length) {
        container.innerHTML = `<div class="card product-card" style="grid-column:1/-1;"><strong>No items listed yet</strong><span class="prod-desc">This stall has not published available items yet.</span></div>`;
        return;
      }

      container.innerHTML = available
        .map(
          (p) => `
          <article class="card product-card">
            ${buildProductMediaHtml(p)}
            <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
              <span class="badge">${p.category || vendor.category}</span>
              <span style="font-size:0.75rem; color:var(--muted);">Stock: ${p.stock_qty ?? 0}</span>
            </div>
            <strong style="font-size:1rem; color:var(--navy-900);">${p.name}</strong>
            <p class="prod-desc">${p.description || ""}</p>
            <div style="margin-top:auto; padding-top:0.4rem; display:flex; justify-content:space-between; align-items:center; gap:0.5rem;">
              <div>
                <span class="product-price">${formatKES(p.price_kes)}</span>
                <span style="font-size:0.76rem; color:var(--muted);">/ ${p.unit_label || "unit"}</span>
              </div>
              <button class="btn btn-amber" onclick="addItem('${p.id}')">Add to Cart</button>
            </div>
          </article>
        `
        )
        .join("");
    }
  </script>
</body>
</html>
